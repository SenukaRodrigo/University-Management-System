spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lecturesystem
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Account role is derived from the email domain at signup (see EmailDomainService).
app.email.student-domain=students.uni.edu
app.email.lecturer-domain=uni.edu

spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lecturesystem
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Account role is derived from the email domain at signup (see EmailDomainService).
app.email.student-domain=students.uni.edu
app.email.lecturer-domain=uni.edu

# SMTP (Mailtrap sandbox in dev) — used to send email-verification codes.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email verification: how long a signup code stays valid, and the From address.
app.verification.code-expiry-minutes=15
app.mail.from=no-reply@unisystem.test
